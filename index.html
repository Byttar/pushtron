<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pushtron</title>
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      background: radial-gradient(ellipse at center, #0f140f 0%, #050605 75%);
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(66, 255, 0, 0.08), 0 0 0 1px rgba(66, 255, 0, 0.15);
      cursor: crosshair;
    }

    @font-face {
      font-family: "VT323";
      src: url("assets/VT323-Regular.ttf");
    }

    #unsupported {
      max-width: 420px;
      margin: 24px;
      padding: 20px 24px;
      border: 2px solid rgb(66, 255, 0);
      box-shadow: 0 0 20px rgba(66, 255, 0, 0.2), inset 0 0 0 4px rgb(8, 11, 8), inset 0 0 0 5px rgba(66, 255, 0, 0.45);
      background: rgb(8, 11, 8);
      color: rgb(66, 255, 0);
      font-family: "VT323", monospace;
      font-size: 22px;
      line-height: 1.3;
      text-shadow: 0 0 6px rgba(66, 255, 0, 0.75);
    }

    #unsupported h1 {
      margin: 0 0 12px;
      font-size: 40px;
      font-weight: normal;
    }

    #unsupported p {
      margin: 0 0 8px;
    }
  </style>
  <script src="p5.min.js"></script>

  <!-- Order matters: each file uses classes defined in the ones above it. -->
  <script src="src/config.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/utils/Rect.js"></script>
  <script src="src/Layout.js"></script>
  <script src="src/Input.js"></script>
  <script src="src/world/Level.js"></script>
  <script src="src/entities/Bubble.js"></script>
  <script src="src/entities/Tile.js"></script>
  <script src="src/entities/Block.js"></script>
    <script src="src/entities/Fire.js"></script>
    <script src="src/entities/Goal.js"></script>
  <script src="src/entities/Key.js"></script>
  <script src="src/entities/Button.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/ParticleBurst.js"></script>
  <script src="src/world/World.js"></script>
  <script src="src/SaveData.js"></script>
  <script src="src/audio/Music.js"></script>
  <script src="src/audio/Sfx.js"></script>
  <script src="src/menu/MainMenu.js"></script>
  <script src="src/menu/ExitPrompt.js"></script>
  <script src="src/Game.js"></script>
  <script src="src/render/Theme.js"></script>
  <script src="src/render/DoomFire.js"></script>
  <script src="src/render/MessageOverlay.js"></script>
    <script src="src/render/MenuRenderer.js"></script>
    <script src="src/render/LoadingScreen.js"></script>
  <script src="src/render/Renderer.js"></script>
  <script src="sketch.js"></script>
</head>

<body>
  <main>
    <div id="unsupported" hidden>
      <h1>PUSHTRON</h1>
      <p>&gt; DEVICE NOT SUPPORTED</p>
      <p>&gt; THIS GAME NEEDS A KEYBOARD, A MOUSE AND A WIDER SCREEN.</p>
      <p>&gt; PLEASE OPEN IT ON A COMPUTER._</p>
    </div>
  </main>
</body>

</html>
